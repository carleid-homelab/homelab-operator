name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/carleid-homelab/homelab-operator

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Links the GHCR package to this repository, so it inherits the repo's
          # visibility instead of defaulting to private.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rendering the installer from the same commit that built the image keeps
      # the manifest and the image it references from drifting apart.
      - name: Render the install manifest
        run: make build-installer IMG=${IMAGE}:${GITHUB_SHA}

      # ArgoCD tracks dist/ on the deploy branch. Publishing here rather than
      # committing to main keeps main free of bot commits.
      # The branch is regenerated from main on every build; never edit it by hand.
      - name: Publish rendered manifests to the deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist/install.yaml config/manager/kustomization.yaml
          git diff --quiet --cached || git commit -m "deploy ${GITHUB_SHA:0:7}"
          git push --force origin HEAD:deploy
